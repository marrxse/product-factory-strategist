# Синтетическая фокус-группа демо: сообщение после предтеста (comms-strategy.md, C20).
# Сегменты и признаки — из исследования (ссылки в комментариях); доли — допущение агента для разнообразия, а не доля рынка.

[focus]
n = 60
seed = 18
stimulus = "Сомневаетесь в звонке — нажмите кнопку, и вам перезвонит тот, кому вы доверяете. Разговор он не слышит. Подключаете сами, отключаете в один шаг со своего номера. 149 ₽ в месяц за двоих."
concerns = ["цена", "слежка и приватность", "не нужно мне", "сложно разобраться", "недоверие к оператору", "не успею нажать", "неловко беспокоить близкого", "уже есть защита"]

[[segments]]   # защищающие — платят (product-strategy.md, «Аудитория»; мужчины 31–45 у похожей функции — E44)
name = "защищающий"
share = 0.45
age = [28, 55]
income = ["ниже среднего", "средний", "средний", "выше среднего"]
phone_skill = ["уверенно", "уверенно", "средне"]
habit = ["звонит родителям раз в неделю", "звонит родителям каждый день", "живёт в другом городе", "помогает родителям с банковским приложением"]
attitude = ["считает, что мама справится сама", "боится, что маму обманут", "не доверяет платным услугам оператора", "уже подключил бесплатную блокировку"]
situation = ["знакомых уже обманывали", "маме недавно звонили «из банка»", "ничего такого не случалось", "сам однажды чуть не попался"]

[[segments]]   # близкие старшего возраста — пользуются кнопкой (behavior.md, C16; ВЦИОМ — E3)
name = "близкий старшего возраста"
share = 0.40
age = [58, 82]
income = ["пенсия", "пенсия", "пенсия и подработка"]
phone_skill = ["неуверенно", "средне", "уверенно"]
habit = ["отвечает на все звонки", "не берёт трубку с незнакомых номеров", "почти не пользуется приложениями", "переписывается с внуками в мессенджере"]
attitude = ["уверен, что его не обманут", "стесняется просить детей о помощи", "не любит, когда за ним присматривают", "доверяет сыну или дочери во всём"]
situation = ["звонили «из полиции» в прошлом месяце", "подруга потеряла деньги", "ничего такого не случалось", "однажды перевёл деньги «внуку»"]

[[segments]]   # скептики и пользователи конкурентов (research.md, C3, C23)
name = "скептик или клиент конкурента"
share = 0.15
age = [25, 65]
income = ["средний", "выше среднего"]
phone_skill = ["уверенно"]
habit = ["пользуется определителем номера банка", "подключил семейную защиту у другого оператора", "ставит антивирус на телефон"]
attitude = ["считает, что защита должна быть бесплатной", "не верит рекламе операторов", "готов платить за то, что реально работает"]
situation = ["читал, что операторы продают положенное бесплатно", "ничего такого не случалось"]
