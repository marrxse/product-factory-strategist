<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1002" width="1200" height="1002" role="img" aria-label="Цепочка оснований вывода C15 до дословных цитат источников; отзыв записи E36 затрагивает 9 выводов и 36 мест в 7 документах">
