<text x="160" y="904" font-size="21" font-weight="600" fill="#1d1d1f" letter-spacing="-0.2" text-anchor="start">Отзовите один источник — агент сам найдёт, что пересмотреть.</text>
<text x="160" y="932" font-size="16" font-weight="400" fill="#6e6e73" letter-spacing="0" text-anchor="start">Для E36 это 9 зависимых выводов и 36 мест в 7 документах. В демо так прошли два пересмотра.</text>
