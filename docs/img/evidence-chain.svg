<text x="212" y="436" font-size="18" font-weight="400" fill="#1d1d1f" letter-spacing="-0.2" text-anchor="start">«45% респондентов продолжают беседу…»</text>
<text x="212" y="464" font-size="15" font-weight="400" fill="#6e6e73" letter-spacing="0" text-anchor="start">исследование Народного фронта · качество B</text>
