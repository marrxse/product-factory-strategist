<text x="212" y="522" font-size="18" font-weight="400" fill="#1d1d1f" letter-spacing="-0.2" text-anchor="start">«…избежать материальных потерь удалось лишь 6%»</text>
<text x="212" y="550" font-size="15" font-weight="400" fill="#6e6e73" letter-spacing="0" text-anchor="start">опрос «Сравни», январь 2026 · качество C</text>
