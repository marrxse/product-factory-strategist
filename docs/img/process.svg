<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Девять этапов работы агента; на шести из них решает человек">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif}</style>

<rect x="1" y="1" width="1198" height="498" rx="28" fill="#ffffff" stroke="#e3e3e8" stroke-width="2"/>
<text x="80" y="98" font-size="20" font-weight="600" fill="#00a650" letter-spacing="0.2" text-anchor="start">Как идёт работа</text>
<text x="80" y="160" font-size="48" font-weight="700" fill="#1d1d1f" letter-spacing="-1.3" text-anchor="start">9 этапов. 6 решений — ваши.</text>
<text x="80" y="202" font-size="21" font-weight="400" fill="#6e6e73" letter-spacing="-0.2" text-anchor="start">На воротах агент останавливается и ждёт вашего ответа. Остальное делает сам.</text>
<rect x="130" y="299" width="940" height="2" fill="#d1d1d6"/>
<text x="130" y="266" font-size="15" font-weight="600" fill="#6e6e73" letter-spacing="0" text-anchor="middle">0</text>
<circle cx="130" cy="300" r="15" fill="#ffffff" stroke="#00a650" stroke-width="2.5"/>
<circle cx="130" cy="300" r="7" fill="#00a650"/>
<text x="130" y="350" font-size="16" font-weight="600" fill="#1d1d1f" letter-spacing="-0.2" text-anchor="middle">Постановка</text>
<text x="130" y="374" font-size="14" font-weight="500" fill="#00a650" letter-spacing="0" text-anchor="middle">решаете вы</text>
<text x="248" y="266" font-size="15" font-weight="600" fill="#6e6e73" letter-spacing="0" text-anchor="middle">1</text>
<circle cx="248" cy="300" r="9" fill="#ffffff" stroke="#6e6e73" stroke-width="2"/>
<text x="248" y="350" font-size="16" font-weight="600" fill="#1d1d1f" letter-spacing="-0.2" text-anchor="middle">Сбор</text>
<text x="365" y="266" font-size="15" font-weight="600" fill="#6e6e73" letter-spacing="0" text-anchor="middle">2</text>
<circle cx="365" cy="300" r="15" fill="#ffffff" stroke="#00a650" stroke-width="2.5"/>
<circle cx="365" cy="300" r="7" fill="#00a650"/>
<text x="365" y="350" font-size="16" font-weight="600" fill="#1d1d1f" letter-spacing="-0.2" text-anchor="middle">План</text>
<text x="365" y="374" font-size="14" font-weight="500" fill="#00a650" letter-spacing="0" text-anchor="middle">решаете вы</text>
<text x="482" y="266" font-size="15" font-weight="600" fill="#6e6e73" letter-spacing="0" text-anchor="middle">3</text>
<circle cx="482" cy="300" r="9" fill="#ffffff" stroke="#6e6e73" stroke-width="2"/>
<text x="482" y="350" font-size="16" font-weight="600" fill="#1d1d1f" letter-spacing="-0.2" text-anchor="middle">Исследование</text>
<text x="600" y="266" font-size="15" font-weight="600" fill="#6e6e73" letter-spacing="0" text-anchor="middle">4</text>
<circle cx="600" cy="300" r="15" fill="#ffffff" stroke="#00a650" stroke-width="2.5"/>
<circle cx="600" cy="300" r="7" fill="#00a650"/>
<text x="600" y="350" font-size="16" font-weight="600" fill="#1d1d1f" letter-spacing="-0.2" text-anchor="middle">Варианты</text>
<text x="600" y="374" font-size="14" font-weight="500" fill="#00a650" letter-spacing="0" text-anchor="middle">решаете вы</text>
<text x="718" y="266" font-size="15" font-weight="600" fill="#6e6e73" letter-spacing="0" text-anchor="middle">5</text>
<circle cx="718" cy="300" r="15" fill="#ffffff" stroke="#00a650" stroke-width="2.5"/>
<circle cx="718" cy="300" r="7" fill="#00a650"/>
<text x="718" y="350" font-size="16" font-weight="600" fill="#1d1d1f" letter-spacing="-0.2" text-anchor="middle">Стратегии</text>
<text x="718" y="374" font-size="14" font-weight="500" fill="#00a650" letter-spacing="0" text-anchor="middle">решаете вы</text>
<text x="835" y="266" font-size="15" font-weight="600" fill="#6e6e73" letter-spacing="0" text-anchor="middle">6</text>
<circle cx="835" cy="300" r="15" fill="#ffffff" stroke="#00a650" stroke-width="2.5"/>
<circle cx="835" cy="300" r="7" fill="#00a650"/>
<text x="835" y="350" font-size="16" font-weight="600" fill="#1d1d1f" letter-spacing="-0.2" text-anchor="middle">План проверки</text>
<text x="835" y="374" font-size="14" font-weight="500" fill="#00a650" letter-spacing="0" text-anchor="middle">решаете вы</text>
<text x="952" y="266" font-size="15" font-weight="600" fill="#6e6e73" letter-spacing="0" text-anchor="middle">7</text>
<circle cx="952" cy="300" r="9" fill="#ffffff" stroke="#6e6e73" stroke-width="2"/>
<text x="952" y="350" font-size="16" font-weight="600" fill="#1d1d1f" letter-spacing="-0.2" text-anchor="middle">Решение</text>
<text x="1070" y="266" font-size="15" font-weight="600" fill="#6e6e73" letter-spacing="0" text-anchor="middle">8</text>
<circle cx="1070" cy="300" r="15" fill="#ffffff" stroke="#00a650" stroke-width="2.5"/>
<circle cx="1070" cy="300" r="7" fill="#00a650"/>
<text x="1070" y="350" font-size="16" font-weight="600" fill="#1d1d1f" letter-spacing="-0.2" text-anchor="middle">Пересмотр</text>
<text x="1070" y="374" font-size="14" font-weight="500" fill="#00a650" letter-spacing="0" text-anchor="middle">решаете вы</text>
<text x="80" y="440" font-size="17" font-weight="400" fill="#6e6e73" letter-spacing="0" text-anchor="start">После решения агент следит за его основаниями и сам предлагает пересмотр, когда данные меняются.</text>
</svg>
