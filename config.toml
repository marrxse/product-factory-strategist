# Настройки агента. Секретов здесь нет и быть не должно.

[models]
# Роль → модель (Claude Code). Обоснование — docs/ARCHITECTURE.md, раздел «Маршрутизация».
orchestrator = "claude-sonnet-5-5"   # ведёт процесс, пишет результаты
researcher   = "claude-haiku-5-5"    # массовое извлечение из источников — дёшево
critic       = "claude-opus-5-5"     # сильнейшие возражения — нужна глубина
verifier     = "claude-sonnet-5-5"   # сверка утверждений с цитатами
respondent   = "claude-haiku-5-5"    # синтетические респонденты
classifier   = "claude-haiku-5-5"    # качество источников A/B/C по признакам — узкая задача, дешёвая модель
# Эскалация: если verifier или validate нашли ошибки на шаге — повторить шаг моделью уровнем выше.
escalation = ["claude-haiku-5-5", "claude-sonnet-5-5", "claude-opus-5-5"]

[routing]
# Выбор процесса, модели и инструмента под задачу: sf.py route "<задача>".
# words — начала слов: «интерфейс» ловит «интерфейса», но не «интервью». При равенстве побеждает правило выше.
[[routing.rules]]
name = "сторож оснований"
words = ["изменил", "изменен", "сторож", "свеж", "watch", "актуальн", "исчез"]
skill = "decision-support"
role = "orchestrator"
tool = "sf.py watch (на месте ли цитаты в живых источниках) · sf.py revisit --stale (возраст по дате публикации)"
why = "проверку делает код по сохранённым снимкам; модель только решает, запускать ли пересмотр — и спрашивает человека"
[[routing.rules]]
name = "цена и готовность платить"
words = ["цена", "цену", "цены", "ценообраз", "прайс", "тариф", "платить", "вестендорп", "грейнджер", "дороже", "дешевле"]
skill = "product-strategy"
role = "orchestrator"
tool = "sf.py kb цена · sf.py price vw|gg · расчёт размера ценового теста в state/analysis/"
why = "опрос даёт диапазон, а не цену; размер теста считает код; синтетика готовность платить не измеряет"
[[routing.rules]]
name = "оценка качества источников"
words = ["качеств", "классиф", "достовер", "надёжн", "источник", "реестр"]
skill = "collect"
role = "classifier"
tool = "sf.py route classify-input → субагент classifier → sf.py route compare"
why = "узкая классификация по признакам из knowledge/source-quality.md; расхождения проверяет verifier"
[[routing.rules]]
name = "сбор фактов из многих источников"
words = ["извле", "источник", "собра", "сбор", "собер", "страниц", "сайт", "реестр"]
skill = "collect"
role = "researcher"
tool = "sf.py fetch · sf.py media text (страницы на скриптах) · субагент researcher при >5 источниках"
why = "массовое извлечение цитат — дешёвая модель; выводы не делает"
[[routing.rules]]
name = "интерфейсы и пользовательский путь"
words = ["интерфейс", "экран", "скрин", "ux", "пут", "лендинг", "кнопк", "макет", "телефон", "композиц", "дизайн", "витрин"]
skill = "ux-review"
role = "orchestrator"
tool = "sf.py media shot (компьютер и телефон) · sf.py media inspect"
why = "нужно зрение и привязка к видимому; дешёвая модель чаще додумывает невидимое"
[[routing.rules]]
name = "ответы нейросетей"
words = ["нейросет", "ассистент", "алис", "gigachat", "chatgpt", "geo", "нейропоиск", "ответы ии"]
skill = "comms-strategy"
role = "orchestrator"
tool = "sources/geo/questions.md → ответы ассистентов в sources/geo/ → sf.py geo --brands … --risky …"
why = "канал коммуникации: что ассистенты говорят покупателю; расчёт упоминаний и источников — кодом"
[[routing.rules]]
name = "аудио и видео"
words = ["аудио", "видео", "запис", "ролик", "подка"]
skill = "ux-review"
role = "orchestrator"
tool = "sf.py media inspect · media frames (ffmpeg) · media transcribe (whisper)"
why = "сначала перевести в кадры и текст, потом анализировать как изображения и интервью"
[[routing.rules]]
name = "анализ поведения клиентов"
words = ["поведен", "мотив", "отток", "удержан", "уход", "churn", "retention", "активац", "когорт", "привычк", "почему не покупа"]
skill = "behavior-analysis"
role = "orchestrator"
tool = "sf.py behavior events|churn (--within, --where) · методичка behavior-analysis"
why = "сначала наблюдаемые действия и расчёт кодом, затем механизм как гипотеза; модель выбирает разрезы и проверяет смешение факторов"
[[routing.rules]]
name = "таблицы и расчёты"
words = ["таблиц", "csv", "расчёт", "расчет", "посчита", "воронк", "конверс", "метрик"]
skill = "data-analysis"
role = "orchestrator"
tool = "sf.py analyze · скрипт в state/analysis/ · evidence kind=calc"
why = "числа считает код, а не модель; модель выбирает метод и проверяет единицы и периоды"
[[routing.rules]]
name = "интервью"
words = ["интервью", "расшифр", "гайд", "собесед"]
skill = "interview-guide"
role = "orchestrator"
tool = "—"
why = "вопросы без подсказки ответа; персональные данные удаляются"
[[routing.rules]]
name = "синтетические респонденты"
words = ["синтет", "персон", "респондент"]
skill = "synthetic-respondents"
role = "respondent"
tool = "субагент respondent"
why = "ролевая игра для гипотез — дешёвая модель, не знает наших гипотез"
[[routing.rules]]
name = "возражения и критика"
words = ["возраж", "критик", "слаб", "рубрик", "контраргум"]
skill = "quality-review"
role = "critic"
tool = "субагент critic"
why = "самые сильные возражения требуют глубины — сильная модель без истории процесса"
[[routing.rules]]
name = "сверка утверждений с источниками"
words = ["сверк", "свери", "цитат", "утвержден"]
skill = "quality-review"
role = "verifier"
tool = "sf.py sample · субагент verifier"
why = "сверка по цитатам — средняя модель"
[[routing.rules]]
name = "пересмотр при новых данных"
words = ["пересм", "новые", "новых", "отозв", "устарел"]
skill = "decision-support"
role = "orchestrator"
tool = "sf.py revisit · sf.py revisit --stale"
why = "граф выводов находит затронутое кодом; модель предлагает правки «было → стало»"

[budget]
confirm_usd = 2.0              # шаг дороже — спросить человека
project_soft_limit_usd = 15.0  # предупредить при превышении по проекту

[limits]
max_steps_per_stage = 25
max_rework_cycles = 2
max_questions_per_turn = 3

[evidence]
max_age_days = 180             # источник не сверяли дольше — предложить sf.py watch
max_data_age_days = 730        # данные опубликованы раньше (по полю published) — «устарели» в sf.py revisit --stale

[validate]
# Файлы, где числа без меток допустимы (планы и отчёты о самой работе, а не выводы о мире)
skip_number_check = ["research-plan.md", "quality-report.md", "interview-guide.md"]
# Разделы о самой работе агента (затраты, бюджет), а не о мире
skip_number_sections = ["стоимость этой работы", "бюджет и сроки", "чего не обещаем"]

[estimate]
# Для сред, которые не отдают токены (Cursor): токены ≈ символы / коэффициент.
# Калибруется по фактам из транскрипта Claude Code: sf.py cost calibrate. Значение по умолчанию — грубое, до калибровки.
chars_per_token = 3.0

[prices]
# USD за 1 млн токенов, тарифы Anthropic API. Источник: справка Claude API, данные на 2026-10-06.
# cache_write_5m = 1.25 × input, cache_write_1h = 2 × input — стандартные множители API (выведено, не из таблицы).
# В подписке Claude Code деньги списываются иначе: считаем «API-эквивалент» — сколько стоил бы тот же объём через API.
checked = "2026-10-06"
[prices.claude-opus-5-5]
input = 4.00
output = 20.00
cache_read = 0.20
cache_write_5m = 5.00
cache_write_1h = 8.00
[prices.claude-sonnet-5-5]
input = 2.00
output = 10.00
cache_read = 0.20
cache_write_5m = 2.50
cache_write_1h = 4.00
[prices.claude-haiku-5-5]
# Цены для запросов до 100K токенов; cache_read = 0.1 × input (выведено).
input = 0.10
output = 0.50
cache_read = 0.01
cache_write_5m = 0.125
cache_write_1h = 0.20

[quality]
rubric_min = 10                # из 14 (7 критериев × 0–2)
verified_share_min = 0.9       # доля подтверждённых утверждений в выборке
sample_size = 10
seed = 42
