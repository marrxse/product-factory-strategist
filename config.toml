# Настройки агента. Секретов здесь нет и быть не должно.

[models]
# Роль → модель (Claude Code). Обоснование — docs/ARCHITECTURE.md, раздел «Маршрутизация».
orchestrator = "claude-sonnet-5-5"   # ведёт процесс, пишет результаты
researcher   = "claude-haiku-5-5"    # массовое извлечение из источников — дёшево
critic       = "claude-opus-5-5"     # сильнейшие возражения — нужна глубина
verifier     = "claude-sonnet-5-5"   # сверка утверждений с цитатами
respondent   = "claude-haiku-5-5"    # синтетические респонденты
# Эскалация: если verifier или validate нашли ошибки на шаге — повторить шаг моделью уровнем выше.
escalation = ["claude-haiku-5-5", "claude-sonnet-5-5", "claude-opus-5-5"]

[budget]
confirm_usd = 2.0              # шаг дороже — спросить человека
project_soft_limit_usd = 15.0  # предупредить при превышении по проекту

[limits]
max_steps_per_stage = 25
max_rework_cycles = 2
max_questions_per_turn = 3

[evidence]
max_age_days = 180             # старше — «основание устарело» в sf.py revisit --stale

[validate]
# Файлы, где числа без меток допустимы (планы и отчёты о самой работе, а не выводы о мире)
skip_number_check = ["research-plan.md", "quality-report.md"]
# Разделы о самой работе агента (затраты, бюджет), а не о мире
skip_number_sections = ["стоимость этой работы", "бюджет и сроки"]

[estimate]
# Для сред, которые не отдают токены (Cursor): токены ≈ символы / коэффициент.
# Калибруется по фактам из транскрипта Claude Code: sf.py cost calibrate. Значение по умолчанию — грубое, до калибровки.
chars_per_token = 3.0

[prices]
# USD за 1 млн токенов, тарифы Anthropic API. Источник: справка Claude API, данные на 2026-10-06.
# cache_write_5m = 1.25 × input, cache_write_1h = 2 × input — стандартные множители API (выведено, не из таблицы).
# В подписке Claude Code деньги списываются иначе: считаем «API-эквивалент» — сколько стоил бы тот же объём через API.
checked = "2026-10-06"
[prices.claude-opus-5-5]
input = 4.00
output = 20.00
cache_read = 0.20
cache_write_5m = 5.00
cache_write_1h = 8.00
[prices.claude-sonnet-5-5]
input = 2.00
output = 10.00
cache_read = 0.20
cache_write_5m = 2.50
cache_write_1h = 4.00
[prices.claude-haiku-5-5]
# Цены для запросов до 100K токенов; cache_read = 0.1 × input (выведено).
input = 0.10
output = 0.50
cache_read = 0.01
cache_write_5m = 0.125
cache_write_1h = 0.20

[quality]
rubric_min = 10                # из 14 (7 критериев × 0–2)
verified_share_min = 0.9       # доля подтверждённых утверждений в выборке
sample_size = 10
seed = 42
